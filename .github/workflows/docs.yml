name: Build and deploy Zola website
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Build Zola + upload Pages artifact
        uses: getzola/github-pages@066755243e69f508fd1a74739fbf1a65f656c790
        with:
          zola_version: v0.23.1
          working_directory: docs

  deploy:
    # Upstream only. A fork has no Pages site to deploy to, so this step fails
    # with a 404 from actions/deploy-pages on every push to master and the run
    # goes red for a reason that has nothing to do with the change. The build job
    # above still runs everywhere, so a fork keeps the check that matters: that
    # the documentation site builds.
    #
    # To publish this fork's docs (or its papers) instead, enable Pages on the
    # fork and change this condition to name it.
    if: github.ref == 'refs/heads/master' && github.repository == 'getzola/zola'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
